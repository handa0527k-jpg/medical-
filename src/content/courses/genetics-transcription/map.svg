<svg viewBox="0 0 1000 680" role="img" aria-label="転写の見取り図：核の中でRNAポリメラーゼIIがDNAを写してmRNA前駆体をつくり、キャップ・スプライシング・ポリAで整えて核膜孔から細胞質へ届けるまで。細菌とミトコンドリアの転写も示す">
<defs>
<marker id="txme" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--eosin)"/></marker>
<marker id="txmh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--hema2)"/></marker>
</defs>
<!-- cell -->
<rect x="30" y="60" width="940" height="590" rx="140" fill="var(--cell)" stroke="var(--hema2)" stroke-width="6"/>
<text x="860" y="470" font-size="20" fill="var(--hema)" font-weight="700" font-family="Zen Kaku Gothic New">細胞質</text>
<!-- nucleus with a nuclear pore on the right -->
<ellipse cx="360" cy="350" rx="300" ry="235" fill="var(--hemat)" stroke="var(--hema2)" stroke-width="4" stroke-dasharray="26 8"/>
<rect x="648" y="328" width="26" height="44" fill="var(--hemat)"/>
<g stroke="var(--hema2)" stroke-width="7" stroke-linecap="round"><path d="M660 312 L660 330"/><path d="M660 370 L660 388"/></g>
<text x="676" y="412" font-size="15" fill="var(--hema)" font-family="Zen Kaku Gothic New">核膜孔</text>
<text x="132" y="222" font-size="20" fill="var(--hema)" font-weight="700" font-family="Zen Kaku Gothic New">核</text>
<!-- DNA with enhancer, promoter (TATA) and a discontinuous gene -->
<path d="M110 254 L600 254 M110 266 L600 266" stroke="var(--hema)" stroke-width="3"/>
<rect x="122" y="248" width="44" height="24" rx="3" fill="var(--hema2)"/>
<rect x="232" y="248" width="36" height="24" fill="none" stroke="#ff922b" stroke-width="3" stroke-dasharray="5 4"/>
<rect x="300" y="246" width="40" height="28" fill="#51cf66"/><rect x="340" y="256" width="44" height="8" fill="#adb5bd"/>
<rect x="384" y="246" width="40" height="28" fill="#51cf66"/><rect x="424" y="256" width="44" height="8" fill="#adb5bd"/>
<rect x="468" y="246" width="50" height="28" fill="#51cf66"/>
<!-- enhancer → polymerase (regulation) -->
<path d="M144 244 C150 170 240 168 262 222" fill="none" stroke="var(--hema2)" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#txmh)"/>
<!-- RNA polymerase II + transcription -->
<circle cx="286" cy="246" r="22" fill="#c9a0ff" opacity=".95"/>
<path d="M310 228 L520 228" fill="none" stroke="var(--eosin)" stroke-width="4" marker-end="url(#txme)"/>
<path d="M290 272 C292 300 270 316 262 326" fill="none" stroke="var(--eosin)" stroke-width="4" marker-end="url(#txme)"/>
<!-- clock genes -->
<g transform="translate(572,214)"><circle r="18" fill="none" stroke="#f08c00" stroke-width="3"/><path d="M0 0 L0 -11 M0 0 L8 4" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/></g>
<!-- mRNA precursor: cap, introns, poly(A) -->
<circle cx="250" cy="340" r="8" fill="#f59f00"/>
<path d="M258 340 q12 -12 24 0 t24 0 t24 0" fill="none" stroke="var(--eosin)" stroke-width="6"/>
<path d="M330 340 q10 -10 20 0 t20 0" fill="none" stroke="#adb5bd" stroke-width="4"/>
<path d="M370 340 q12 -12 24 0 t24 0" fill="none" stroke="var(--eosin)" stroke-width="6"/>
<path d="M418 340 q10 -10 20 0 t20 0" fill="none" stroke="#adb5bd" stroke-width="4"/>
<path d="M458 340 q12 -12 24 0 t24 0" fill="none" stroke="var(--eosin)" stroke-width="6"/>
<text x="510" y="346" font-size="15" fill="#f59f00" font-weight="700">AAAA</text>
<!-- splicing: lariat removed -->
<path d="M380 360 L420 392" fill="none" stroke="var(--hema2)" stroke-width="4" marker-end="url(#txmh)"/>
<circle cx="452" cy="395" r="11" fill="none" stroke="#adb5bd" stroke-width="3"/><path d="M441 397 L425 410" stroke="#adb5bd" stroke-width="3"/>
<!-- mature mRNA → nuclear pore → cytoplasm -->
<circle cx="372" cy="432" r="7" fill="#f59f00"/>
<path d="M379 432 q12 -12 24 0 t24 0 t24 0 t24 0" fill="none" stroke="var(--eosin)" stroke-width="6"/>
<text x="480" y="438" font-size="14" fill="#f59f00" font-weight="700">AAAA</text>
<path d="M528 426 C580 410 620 370 650 352" fill="none" stroke="var(--hema2)" stroke-width="4" marker-end="url(#txmh)"/>
<path d="M674 350 C710 352 730 372 752 390" fill="none" stroke="var(--hema2)" stroke-width="4" marker-end="url(#txmh)"/>
<circle cx="768" cy="404" r="6" fill="#f59f00"/>
<path d="M774 404 q12 -12 24 0 t24 0 t24 0 t24 0" fill="none" stroke="var(--eosin)" stroke-width="6"/>
<g fill="var(--hema2)" opacity=".85"><ellipse cx="800" cy="392" rx="13" ry="9"/><ellipse cx="836" cy="392" rx="13" ry="9"/></g>
<!-- non-coding RNAs (stem-loops) -->
<g fill="none" stroke="#d59cff" stroke-width="4" stroke-linecap="round">
<path d="M206 490 L206 462 a9 9 0 1 1 14 0 L220 490"/><path d="M246 500 L246 474 a9 9 0 1 1 14 0 L260 500"/><path d="M286 488 L286 466 a8 8 0 1 1 12 0 L298 488"/>
</g>
<!-- bacterium inset -->
<rect x="700" y="96" width="220" height="180" rx="18" fill="none" stroke="var(--hema2)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="714" y="122" font-size="15" fill="var(--hema)" font-family="Zen Kaku Gothic New">細菌（別の生物）</text>
<rect x="716" y="134" width="188" height="84" rx="42" fill="var(--hemat)" stroke="#3ddc97" stroke-width="3"/>
<path d="M740 184 L884 184" stroke="var(--hema)" stroke-width="3"/>
<rect x="780" y="176" width="10" height="16" fill="#ff922b"/>
<rect x="794" y="174" width="26" height="20" fill="#51cf66"/><rect x="822" y="174" width="26" height="20" fill="#51cf66"/><rect x="850" y="174" width="26" height="20" fill="#51cf66"/>
<circle cx="768" cy="176" r="12" fill="#c9a0ff"/><circle cx="756" cy="164" r="7" fill="#f08c00"/>
<text x="742" y="160" font-size="14" fill="#f08c00" font-weight="700" text-anchor="end">σ</text>
<path d="M792 162 L874 162" stroke="var(--eosin)" stroke-width="3" marker-end="url(#txme)"/>
<!-- mitochondrion -->
<ellipse cx="820" cy="545" rx="90" ry="45" fill="none" stroke="#3ddc97" stroke-width="4"/>
<circle cx="800" cy="545" r="16" fill="none" stroke="#3ddc97" stroke-width="3"/>
<path d="M826 545 C840 528 856 560 872 540" fill="none" stroke="var(--eosin)" stroke-width="3"/>
<text x="760" y="490" font-size="15" fill="#3ddc97" font-family="Zen Kaku Gothic New">ミトコンドリア</text>
