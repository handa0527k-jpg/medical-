<g class="z" data-c="9" tabindex="0" role="button" aria-label="9 まとめ ― 遺伝子発現の調節とミトコンドリアゲノムの転写"><rect class="hit" x="730" y="500" width="180" height="90"/><g class="tag" transform="translate(620,626)"><rect x="0" y="-22" width="212" height="36" rx="18"/><text x="14" y="4" class="n">9</text><text x="38" y="3">まとめ・mtDNA</text></g></g>
