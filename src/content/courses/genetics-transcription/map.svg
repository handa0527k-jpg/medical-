<g class="z" data-c="1" tabindex="0" role="button" aria-label="1 転写の全体像 ― DNAからRNAへ"><rect class="hit" x="300" y="206" width="230" height="74"/><g class="tag" transform="translate(300,152)"><rect x="0" y="-22" width="166" height="36" rx="18"/><text x="14" y="4" class="n">1</text><text x="38" y="3">転写の全体像</text></g></g>
<g class="z" data-c="2" tabindex="0" role="button" aria-label="2 細菌の転写 ― 開始・伸長・終結"><rect class="hit" x="716" y="134" width="70" height="84"/><g class="tag" transform="translate(706,312)"><rect x="0" y="-22" width="147" height="36" rx="18"/><text x="14" y="4" class="n">2</text><text x="38" y="3">細菌の転写</text></g></g>
<g class="z" data-c="3" tabindex="0" role="button" aria-label="3 遺伝子発現の調節 ― lacオペロン"><rect class="hit" x="786" y="150" width="118" height="68"/><g class="tag" transform="translate(744,252)"><rect x="0" y="-22" width="164" height="36" rx="18"/><text x="14" y="4" class="n">3</text><text x="38" y="3">lacオペロン</text></g></g>
<g class="z" data-c="4" tabindex="0" role="button" aria-label="4 真核生物の転写開始 ― 基本転写因子と転写開始複合体"><rect class="hit" x="226" y="222" width="74" height="56"/><g class="tag" transform="translate(304,300)"><rect x="0" y="-22" width="128" height="36" rx="18"/><text x="14" y="4" class="n">4</text><text x="38" y="3">転写開始</text></g></g>
<g class="z" data-c="5" tabindex="0" role="button" aria-label="5 転写調節配列と細胞の個性"><rect class="hit" x="110" y="166" width="120" height="110"/><g class="tag" transform="translate(76,312)"><rect x="0" y="-22" width="166" height="36" rx="18"/><text x="14" y="4" class="n">5</text><text x="38" y="3">転写調節配列</text></g></g>
<g class="z" data-c="6" tabindex="0" role="button" aria-label="6 時計遺伝子と疾患"><rect class="hit" x="550" y="192" width="44" height="44"/><g class="tag" transform="translate(484,168)"><rect x="0" y="-22" width="147" height="36" rx="18"/><text x="14" y="4" class="n">6</text><text x="38" y="3">時計遺伝子</text></g></g>
<g class="z" data-c="7" tabindex="0" role="button" aria-label="7 mRNAのプロセシング ― キャップ・ポリA・スプライシング"><rect class="hit" x="240" y="322" width="320" height="126"/><g class="tag" transform="translate(340,494)"><rect x="0" y="-22" width="166" height="36" rx="18"/><text x="14" y="4" class="n">7</text><text x="38" y="3">プロセシング</text></g></g>
