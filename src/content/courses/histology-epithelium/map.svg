<g opacity=".9">
<rect x="60" y="120" width="120" height="22" rx="6" fill="var(--eosin)" opacity=".7"/><rect x="60" y="148" width="120" height="22" rx="6" fill="var(--hema2)" opacity=".5"/><rect x="60" y="176" width="120" height="22" rx="6" fill="var(--hema2)" opacity=".35"/><rect x="60" y="204" width="120" height="22" rx="6" fill="var(--hema2)" opacity=".2"/>
</g>
<g stroke="var(--eosin)" stroke-width="5" stroke-linecap="round"><path d="M250 190 v-26"/><path d="M268 190 v-26"/><path d="M286 190 v-26"/><path d="M304 190 v-26"/><path d="M322 190 v-26"/><path d="M340 190 v-26"/></g>
