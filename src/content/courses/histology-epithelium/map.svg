<g class="z" data-c="4" tabindex="0" role="button" aria-label="4 接着装置と基底面の構造"><rect class="hit" x="220" y="460" width="260" height="80"/><g class="tag" transform="translate(110,610)"><rect x="0" y="-22" width="270" height="36" rx="18"/><text x="14" y="4" class="n">4</text><text x="38" y="3">接着装置と基底面の構造</text></g></g>
<g class="z" data-c="5" tabindex="0" role="button" aria-label="5 上皮の分類：単層と重層扁平"><rect class="hit" x="550" y="110" width="360" height="300"/><g class="tag" transform="translate(640,250)"><rect x="0" y="-22" width="300" height="36" rx="18"/><text x="14" y="4" class="n">5</text><text x="38" y="3">上皮の分類：単層と重層扁平</text></g></g>
<g class="z" data-c="6" tabindex="0" role="button" aria-label="6 多列円柱上皮・杯細胞・移行上皮"><rect class="hit" x="550" y="450" width="380" height="130"/><g class="tag" transform="translate(560,630)"><rect x="0" y="-22" width="330" height="36" rx="18"/><text x="14" y="4" class="n">6</text><text x="38" y="3">多列円柱上皮・杯細胞・移行上皮</text></g></g>
