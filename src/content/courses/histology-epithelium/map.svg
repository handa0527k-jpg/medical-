<g font-family="Zen Kaku Gothic New" font-size="14" fill="var(--mute)">
<text x="60" y="246">4大組織</text><text x="190" y="186">頂上面</text><text x="380" y="300">結合装置</text><text x="230" y="560">基底面・基底膜</text>
