<g fill="var(--hemat)" stroke="var(--eosin)" stroke-width="2"><rect x="760" y="120" width="26" height="60" rx="5"/><rect x="788" y="120" width="26" height="60" rx="5"/><rect x="816" y="120" width="26" height="60" rx="5"/><rect x="844" y="120" width="26" height="60" rx="5"/><rect x="872" y="120" width="26" height="60" rx="5"/></g>
