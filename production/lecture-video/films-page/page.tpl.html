<title>遺伝子の基礎 講義動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: a video site — top bar, the player and its description on the left, the 6-lecture playlist on the right (stacked under the player on phones). */
:root {
  --bg: #ffffff; --surface: #f2f2f2; --surface-2: #e5e5e5; --fg: #0f0f0f; --fg-2: #606060; --line: #e3e3e3;
  --accent: #c8102e; --accent-fg: #ffffff; --chip: #0f0f0f; --chip-fg: #ffffff; --now: #fdecef; --shadow: rgba(0,0,0,.12);
  --font: "Roboto", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0f0f; --surface: #272727; --surface-2: #3a3a3a; --fg: #f1f1f1; --fg-2: #aaaaaa; --line: #303030;
  --accent: #ff4e5f; --accent-fg: #0f0f0f; --chip: #f1f1f1; --chip-fg: #0f0f0f; --now: #3b1d22; --shadow: rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f0f0f; --surface: #272727; --surface-2: #3a3a3a; --fg: #f1f1f1; --fg-2: #aaaaaa; --line: #303030;
  --accent: #ff4e5f; --accent-fg: #0f0f0f; --chip: #f1f1f1; --chip-fg: #0f0f0f; --now: #3b1d22; --shadow: rgba(0,0,0,.5); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 var(--font); margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand .mark { width: 30px; height: 21px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.brand .mark::after { content: ""; border-left: 9px solid var(--accent-fg); border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent; margin-left: 2px; }
.brand small { font-weight: 400; color: var(--fg-2); font-size: 12px; }
.search { flex: 1; max-width: 560px; margin-inline: auto; display: flex; min-width: 0; }
.search input { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line); border-right: 0; border-radius: 20px 0 0 20px; padding: 0 16px; background: var(--bg); color: var(--fg); font: inherit; }
.search span { width: 56px; border: 1px solid var(--line); border-radius: 0 20px 20px 0; background: var(--surface); display: grid; place-items: center; color: var(--fg-2); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: var(--surface); }

.page { display: grid; grid-template-columns: minmax(0, 1fr) 402px; gap: 24px; max-width: 1754px; margin: 0 auto; padding-block: 24px; padding-inline: 24px; }
.player { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
.player video { width: 100%; height: 100%; display: block; background: #000; }
.chapbar { display: flex; gap: 2px; height: 4px; margin-top: 8px; }
.chapbar i { background: var(--surface-2); border-radius: 2px; position: relative; overflow: hidden; cursor: pointer; }
.chapbar i b { position: absolute; inset: 0; width: 0; background: var(--accent); }
h1 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 12px 0 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
.ch { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ava { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #6b2bd9); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.ch b { display: block; font-size: 16px; }
.ch small { color: var(--fg-2); font-size: 12px; }
.pills { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.pill:hover { background: var(--surface-2); }
.pill.on { background: var(--chip); color: var(--chip-fg); }
.desc { margin-top: 12px; background: var(--surface); border-radius: 12px; padding: 12px; }
.desc .facts { font-weight: 500; font-variant-numeric: tabular-nums; }
.desc p { margin: 6px 0 0; max-width: 70ch; }
.chapters { margin-top: 12px; display: grid; gap: 2px; }
.chapters h3 { font-size: 13px; margin: 10px 0 2px; color: var(--fg-2); font-weight: 700; letter-spacing: .02em; }
.chap { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.chap:hover { background: var(--surface-2); }
.chap .tc { color: #3ea6ff; font-variant-numeric: tabular-nums; font-weight: 500; }
:root:not([data-theme="dark"]) .chap .tc { color: #065fd4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chap .tc { color: #3ea6ff; } }
.chap.now { background: var(--now); }
.chap.now .t { font-weight: 700; }
.note { color: var(--fg-2); font-size: 12px; margin-top: 12px; max-width: 80ch; }

.side { min-width: 0; }
.plist { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.plist header { padding: 12px 16px; background: var(--surface); display: flex; align-items: center; gap: 8px; }
.plist header b { font-size: 16px; display: block; }
.plist header small { color: var(--fg-2); }
.plist header .grow { flex: 1; min-width: 0; }
.auto { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
.auto input { accent-color: var(--accent); }
.items { display: grid; padding: 4px 0; }
.item { display: grid; grid-template-columns: 24px 168px minmax(0,1fr); gap: 8px; padding: 6px 12px 6px 4px; align-items: start; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.item:hover { background: var(--surface); }
.item.now { background: var(--now); }
.item .n { color: var(--fg-2); font-size: 12px; text-align: center; align-self: center; font-variant-numeric: tabular-nums; }
.item.now .n { color: var(--accent); }
.thumb { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; background: #111; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dur { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.35); }
.prog b { display: block; height: 100%; background: var(--accent); }
.item .tt { font-weight: 500; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .sub { color: var(--fg-2); font-size: 12px; margin-top: 4px; }
.empty { padding: 16px; color: var(--fg-2); }
.keys { margin-top: 16px; color: var(--fg-2); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
kbd { font: 12px var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--fg); }

@media (max-width: 1016px) {
  .page { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; padding-block: 16px; }
}
@media (max-width: 560px) {
  .brand small { display: none; }
  .search { display: none; }
  .top .spacer { flex: 1; }
  .item { grid-template-columns: 20px 140px minmax(0,1fr); }
  .pills { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span>MED·STUDY<small>講義動画</small></div>
  <label class="search"><input id="q" type="search" placeholder="講義・チャプターを検索（例：スプライシング）" aria-label="検索"><span aria-hidden="true">⌕</span></label>
  <span class="spacer"></span>
  <button class="iconbtn" id="theme" type="button" title="明るさを切り替え" aria-label="明るさを切り替え">◐</button>
</header>

<main class="page">
  <section style="min-width:0">
    <div class="player"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="chapbar" id="bar" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <div class="meta">
      <div class="ch"><span class="ava">遺</span><div><b>遺伝医学｜遺伝子の基礎</b><small>構造と機能 · 全6講</small></div></div>
      <div class="pills">
        <button class="pill" id="prev" type="button">◀ 前の講</button>
        <button class="pill" id="next" type="button">次の講 ▶</button>
        <button class="pill" id="speed" type="button" title="再生速度">1.0×</button>
      </div>
    </div>
    <div class="desc">
      <div class="facts" id="facts"></div>
      <p id="about"></p>
      <div class="chapters" id="chapters"></div>
    </div>
    <div class="keys"><span><kbd>K</kbd> 再生／一時停止</span><span><kbd>J</kbd><kbd>L</kbd> 10秒戻る・進む</span><span><kbd>N</kbd><kbd>P</kbd> 次・前の講</span><span><kbd>F</kbd> 全画面</span></div>
    <p class="note">映像の背景と図はすべて MEDSTUDY の描画で、講義資料の内容に沿っています（患者の顔は描いていません）。講師の声は音声合成（Microsoft Neural「Keita」）です。字幕は画面下の帯に表示されます。</p>
  </section>

  <aside class="side">
    <div class="plist">
      <header><div class="grow"><b>遺伝子の基礎</b><small id="pos">1 / 6</small></div>
        <label class="auto"><input type="checkbox" id="auto" checked> 自動再生</label></header>
      <div class="items" id="items"></div>
    </div>
  </aside>
</main>

<script>
const FILMS = __DATA__;
const $ = (s) => document.querySelector(s);
const v = $('#v');
const fmt = (s) => { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), x = s % 60; return `${m}:${String(x).padStart(2, '0')}`; };
const store = { get(k, d) { try { const x = localStorage.getItem('gfilms:' + k); return x == null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem('gfilms:' + k, JSON.stringify(x)); } catch {} } };
let cur = 0, q = '', speeds = [1, 1.25, 1.5, 0.75], si = 0;

function chapterTitle(c) { return c.title.startsWith('タイトル：') ? 'オープニング' : c.title; }

function renderList() {
  const box = $('#items'); box.innerHTML = '';
  const hits = FILMS.map((f, i) => ({ f, i, m: !q || (f.title + f.about + f.chapters.map(chapterTitle).join(' ')).includes(q) })).filter((x) => x.m);
  if (!hits.length) { box.innerHTML = '<div class="empty">一致する講義はありません。別の言葉で探してください。</div>'; return; }
  for (const { f, i } of hits) {
    const seen = store.get('t' + f.lecture, 0), pct = Math.min(100, (seen / f.total) * 100);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'item' + (i === cur ? ' now' : ''); b.setAttribute('aria-current', i === cur ? 'true' : 'false');
    b.innerHTML = `<span class="n">${i === cur ? '▶' : i + 1}</span><span class="thumb"><img src="thumb${f.lecture}.jpg" alt="" loading="lazy"><span class="dur">${fmt(f.total)}</span>${pct > 2 ? `<span class="prog"><b style="width:${pct}%"></b></span>` : ''}</span><span style="min-width:0"><span class="tt">第${f.lecture}講 ${f.title}</span><span class="sub">${f.chapters.length} チャプター</span></span>`;
    b.onclick = () => load(i, true);
    box.appendChild(b);
  }
}

function renderInfo() {
  const f = FILMS[cur];
  $('#title').textContent = `第${f.lecture}講 ${f.title}｜遺伝子の基礎（劇画授業）`;
  $('#facts').textContent = `${fmt(f.total)} · ${f.chapters.length} チャプター · 第${f.lecture}講 / 全6講`;
  $('#about').textContent = f.about;
  $('#pos').textContent = `${cur + 1} / ${FILMS.length}`;
  const box = $('#chapters'); box.innerHTML = '';
  for (const c of f.chapters) {
    if (c.chapter && !/^第\d講$/.test(c.chapter)) { const h = document.createElement('h3'); h.textContent = c.chapter; box.appendChild(h); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chap';
    b.innerHTML = `<span class="tc">${fmt(c.t)}</span><span class="t"></span>`; b.querySelector('.t').textContent = chapterTitle(c);
    b.onclick = () => { v.currentTime = c.t + 0.01; v.play().catch(() => {}); };
    c.el = b; box.appendChild(b);
  }
  const bar = $('#bar'); bar.innerHTML = '';
  f.chapters.forEach((c, k) => {
    const end = k + 1 < f.chapters.length ? f.chapters[k + 1].t : f.total;
    const i = document.createElement('i'); i.style.flex = String(end - c.t); i.title = chapterTitle(c);
    i.innerHTML = '<b></b>'; i.onclick = () => { v.currentTime = c.t + 0.01; };
    c.bar = i.firstChild; c.end = end; bar.appendChild(i);
  });
}

function load(i, play) {
  cur = (i + FILMS.length) % FILMS.length;
  const f = FILMS[cur];
  v.src = `film${f.lecture}.mp4`; v.poster = `thumb${f.lecture}.jpg`; v.playbackRate = speeds[si];
  const resume = store.get('t' + f.lecture, 0);
  v.addEventListener('loadedmetadata', () => { if (resume > 5 && resume < f.total - 10) v.currentTime = resume; v.playbackRate = speeds[si]; }, { once: true });
  store.set('cur', cur);
  try { history.replaceState(null, '', '#l' + f.lecture); } catch {}
  renderInfo(); renderList();
  if (play) v.play().catch(() => {});
  if (matchMedia('(max-width: 1016px)').matches && play) window.scrollTo({ top: 0, behavior: 'smooth' });
}

let lastSave = 0;
v.addEventListener('timeupdate', () => {
  const f = FILMS[cur], t = v.currentTime;
  for (const c of f.chapters) {
    const on = t >= c.t && t < c.end;
    c.el && c.el.classList.toggle('now', on);
    if (c.bar) c.bar.style.width = (t >= c.end ? 100 : on ? ((t - c.t) / (c.end - c.t)) * 100 : 0) + '%';
  }
  if (Math.abs(t - lastSave) > 4) { lastSave = t; store.set('t' + f.lecture, t); }
});
v.addEventListener('ended', () => { store.set('t' + FILMS[cur].lecture, 0); if ($('#auto').checked && cur + 1 < FILMS.length) load(cur + 1, true); else renderList(); });
$('#prev').onclick = () => load(cur - 1, true);
$('#next').onclick = () => load(cur + 1, true);
$('#speed').onclick = () => { si = (si + 1) % speeds.length; v.playbackRate = speeds[si]; $('#speed').textContent = speeds[si].toFixed(speeds[si] % 1 ? 2 : 1).replace(/0$/, '') + '×'; };
$('#auto').checked = store.get('auto', true);
$('#auto').onchange = () => store.set('auto', $('#auto').checked);
$('#q').oninput = (e) => { q = e.target.value.trim(); renderList(); };
$('#theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', r.dataset.theme);
};
const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th;
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'k' || (k === ' ' && e.target === document.body)) { e.preventDefault(); v.paused ? v.play().catch(() => {}) : v.pause(); }
  else if (k === 'j') v.currentTime = Math.max(0, v.currentTime - 10);
  else if (k === 'l') v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10);
  else if (k === 'n') load(cur + 1, true);
  else if (k === 'p') load(cur - 1, true);
  else if (k === 'f') { (document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen?.())?.catch?.(() => {}); }
});
const h = /^#l([1-6])$/.exec(location.hash);
load(h ? Number(h[1]) - 1 : store.get('cur', 0), false);
</script>
