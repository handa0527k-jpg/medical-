<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>BLOOD STORY film</title>
<style>
@font-face { font-family: 'ZenKaku'; src: url('../fonts/ZenKakuGothicNew-Bold.ttf'); }
@font-face { font-family: 'IPAGothic'; src: url('../fonts/ipag.ttf'); }
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="characters.js"></script>
<script src="world.js"></script>
<script src="scenes/common.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const cut = q.get('cut') || 'intro';
  await new Promise((r) => { const s = document.createElement('script'); s.src = `scenes/${cut}.js`; s.onload = r; s.onerror = r; document.body.appendChild(s); });
  await Promise.all([document.fonts.load('48px ZenKaku'), document.fonts.load('48px IPAGothic')]);
  await document.fonts.ready;
  let cues = null;
  for (const f of [`../audio/cues_${cut}.json`, '../audio/cues.json']) {
    try { const r = await fetch(f); if (r.ok) { cues = await r.json(); break; } } catch (e) {}
  }
  const C = BS.cuts[cut];
  const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
  const E = BS.common.makeEnv(cues, C);
  if (C.prepare) await C.prepare(E);
  window.cutDuration = C.duration;
  window.drawAt = (t) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080); C.render(ctx, t, E); BS.common.drawSubtitles(ctx, t, E); };
  window.renderFrame = (t) => { window.drawAt(t); return canvas.toDataURL('image/jpeg', 0.95); };
  const t = q.get('t'); if (t !== null) window.drawAt(+t);
  window.ready = true;
})();
</script></body></html>
