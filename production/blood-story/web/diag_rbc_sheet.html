<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>BLOOD STORY – RBC Diagram Sheet</title>
<style>
  @font-face { font-family: ZenKaku; src: url(../fonts/ZenKakuGothicNew-Bold.ttf); }
  @font-face { font-family: IPAGothic; src: url(../fonts/ipag.ttf); }
  html, body { margin: 0; background: #0b0306; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<canvas id="sheet" width="2880" height="2290"></canvas>
<script src="world.js"></script>
<script src="diag_rbc.js"></script>
<script>
/* Preview / render harness for diag_rbc.js.
 *   diag_rbc_sheet.html               → contact sheet (4×3 panels at 50%)
 *   diag_rbc_sheet.html?d=NAME&p=0.5  → one 1920×1080 frame
 * window.renderFrame(name, p, t) → JPEG data URL (1920×1080, background + diagram at scale 1, centred)
 * window.timeDiag(name, n)       → average ms per diagram draw (no background)
 */
(async function () {
  const W = BS.world, Dg = BS.diag;
  await W.ready(); await Dg.ready();
  const frame = document.createElement('canvas'); frame.width = 1920; frame.height = 1080;
  const ctx = frame.getContext('2d');
  // the vessel-interior backdrop the panels float in
  function bg(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(960, 540, 60, 960, 540, 1150);
    g.addColorStop(0, '#6e1220'); g.addColorStop(1, '#1c0308'); ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
    const cells = [[160, 200, 90, 0.4], [1780, 260, 120, 1.0], [260, 900, 140, 0.7], [1700, 920, 80, 1.2], [980, 120, 60, 0.2]];
    cells.forEach(([x, y, r, tx], i) => W.drawRBC(ctx, { x: x + Math.sin(t * 0.3 + i) * 30, y, r, tiltX: tx, rot: t * 0.1 + i, alpha: 0.35, blur: 6, fog: 0.5, fogColor: '#3a0610' }));
    W.drawParticles(ctx, { t, seed: 9, count: 60, size: 3, alpha: 0.35 });
  }
  const DUR = { centrifugeTube: 6, clotTube: 5, plasmaProteins: 5, rbcModel: 6, membraneSkeleton: 5, hemoglobin: 6,
    lungTissueLoop: 6, co2Transport: 6, erythropoiesis: 6, rbcLifespan: 5, hemeRecycle: 6 };
  window.DIAG_DUR = DUR;
  function fitScale(name) { const s = Dg.SIZE[name]; return Math.min(1, 1840 / s[0], 960 / (s[1] + 90)); }
  function draw(name, p, t) {
    bg(t);
    const sc = fitScale(name), s = Dg.SIZE[name];
    if (name === 'holoPanel') Dg.holoPanel(ctx, { x: 960, y: 500, w: 1100, h: 700, p, t, title: 'holoPanel（汎用フレーム）' });
    else Dg[name](ctx, { x: 960, y: 1080 / 2 - 45 * sc, scale: sc, p, t });
  }
  window.renderFrame = (name, p, t) => { draw(name, p, t); return frame.toDataURL('image/jpeg', 0.93); };
  window.renderPNG = (name, p, t) => { draw(name, p, t); return frame.toDataURL('image/png'); };
  window.timeDiag = (name, n = 30) => {
    let tot = 0, worst = 0;
    for (let i = 0; i < n; i++) {
      const p = i / (n - 1); ctx.clearRect(0, 0, 1920, 1080);
      const t0 = performance.now(); Dg[name](ctx, { x: 960, y: 520, p, t: p * 5 }); ctx.getImageData(0, 0, 1, 1);
      const dt = performance.now() - t0; tot += dt; worst = Math.max(worst, dt);
    }
    return { avg: +(tot / n).toFixed(1), worst: +worst.toFixed(1) };
  };
  const q = new URLSearchParams(location.search);
  const sheet = document.getElementById('sheet'), sx = sheet.getContext('2d');
  if (q.get('d')) {
    sheet.width = 1920; sheet.height = 1080;
    draw(q.get('d'), +(q.get('p') || 1), +(q.get('t') || 1)); sx.drawImage(frame, 0, 0);
  } else {
    const items = [
      ['centrifugeTube', 0.95], ['clotTube', 0.95], ['plasmaProteins', 0.9],
      ['rbcModel', 0.97], ['membraneSkeleton', 0.66], ['hemoglobin', 0.95],
      ['lungTissueLoop', 0.56], ['co2Transport', 0.62], ['erythropoiesis', 0.95],
      ['rbcLifespan', 0.74], ['hemeRecycle', 0.97], ['centrifugeTube', 0.2]
    ];
    sx.fillStyle = '#0b0306'; sx.fillRect(0, 0, sheet.width, sheet.height);
    sx.font = '56px ZenKaku, IPAGothic, sans-serif'; sx.fillStyle = '#ff5a6a'; sx.fillText('BLOOD STORY — 赤血球・血液の模式図（diag_rbc.js）', 30, 74);
    sx.font = '28px ZenKaku, IPAGothic, sans-serif'; sx.fillStyle = '#d8c8cc'; sx.fillText('Agent D1 · 1920×1080 frames at 50% · BS.diag.<name>(ctx, {x, y, scale, p, t})', 32, 116);
    items.forEach(([name, p], i) => {
      draw(name, p, 2.0);
      const cx = (i % 3) * 960, cy = 130 + Math.floor(i / 3) * 540;
      sx.drawImage(frame, cx, cy, 960, 540);
      sx.font = '24px ZenKaku, IPAGothic, sans-serif'; sx.lineWidth = 5; sx.strokeStyle = '#000'; sx.fillStyle = '#fff';
      const lab = (i + 1) + '. ' + name + '  p=' + p; sx.strokeText(lab, cx + 12, cy + 530); sx.fillText(lab, cx + 12, cy + 530);
    });
  }
  window.ready = true;
})();
</script>
</body>
</html>
