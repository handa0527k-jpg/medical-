<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:ZenKaku;src:url('../fonts/ZenKakuGothicNew-Bold.ttf')}body{margin:0}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../web/characters.js"></script>
<script>
// Character motion preview: window.drawFrame(f) renders frame f (30 fps).
const ctx = document.getElementById('c').getContext('2d');
const C = BS.chars;
function lab(t, x, y) { ctx.font = '700 26px ZenKaku, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(t, x, y); }
window.drawFrame = function (f) {
  const t = f / 30;
  const g = ctx.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#6a1424'); g.addColorStop(1, '#2a0610');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  // scrolling floor marks (speed matches stride roughly)
  for (const [y0, spd] of [[520, 900], [1040, 980]]) {
    ctx.fillStyle = 'rgba(255,190,190,0.18)'; ctx.fillRect(0, y0, 1100, 4);
    for (let i = 0; i < 12; i++) { const x = ((i * 140 - t * spd) % 1680 + 1680) % 1680 - 200; ctx.fillRect(x, y0 + 8, 60, 6); }
  }
  const pa = C.runPhase(t, 0.2), ps = C.runPhase(t, 0.18);
  C.drawAkane(ctx, { x: 520, y: 520, scale: 0.75, view: 'side', pose: 'run', runPhase: pa, expr: 'determined', t, blink: C.blinkAt(t, 1) });
  C.drawShirou(ctx, { x: 520, y: 1040, scale: 0.72, view: 'side', pose: 'run', runPhase: ps, expr: 'serious', t, blink: C.blinkAt(t, 2) });
  C.drawWBCAlly(ctx, { x: 230, y: 1040, scale: 0.6, variant: 0, view: 'side', pose: 'run', runPhase: (ps + 0.3) % 1, t });
  C.drawWBCAlly(ctx, { x: 850, y: 1040, scale: 0.62, variant: 2, view: 'side', pose: 'run', runPhase: (ps + 0.6) % 1, t });
  // camera orbit to the front (yaw 90 -> 0)
  const yaw = 90 - 90 * Math.min(1, Math.max(0, (t - 0.3) / 2.2));
  C.drawAkane(ctx, { x: 1320, y: 1000, scale: 1.25, yaw, pose: 'run', runPhase: pa, expr: 'happy', mouth: 0.5 + 0.5 * Math.sin(t * 13), t, blink: C.blinkAt(t, 3) });
  // face close-up: lipsync + blink
  ctx.save(); ctx.beginPath(); ctx.roundRect(1480, 40, 420, 420, 20); ctx.clip();
  ctx.fillStyle = '#f6e9ee'; ctx.fillRect(1480, 40, 420, 420);
  const o = { scale: 3.4, view: 'threeq', pose: 'stand', expr: t < 1.5 ? 'happy' : 'determined', mouth: Math.max(0, Math.sin(t * 11) * 0.8), blink: C.blinkAt(t, 5), t };
  const a = C.headAnchor('akane', Object.assign({ x: 0, y: 0 }, o)); o.x = 1690 - a.x; o.y = 260 - a.y;
  C.drawAkane(ctx, o); ctx.restore();
  lab('side run 0.2s/step', 40, 50); lab('Shirou 0.18s/step + allies', 40, 600); lab('yaw ' + yaw.toFixed(0) + '°', 1200, 560);
};
window.__ready = true;
</script></body></html>
